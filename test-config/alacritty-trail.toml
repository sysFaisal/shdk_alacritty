# Isolated development configuration for cursor-trail testing.
# It is passed explicitly with --config-file and does not modify ~/.config/alacritty.


[cursor]
style = "Block"
unfocused_hollow = true

[cursor.trail]
enabled = true

[cursor.trail.decay]
fast = 100
slow = 400

[cursor.trail.start_threshold]
horizontal = 2
vertical = 2

[window]
dynamic_padding = true

[font]
size = 12.0
